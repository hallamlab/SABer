name: genome_qc
channels:
  - conda-forge
  - bioconda
  - ursky
  - defaults
dependencies:
  - barrnap
  - bedtools
  - blast
  - checkm-genome
  - fastani
  - fasttree
  - gtdbtk=2.3.2
  - gunc
  - hmmer
  - mash
  - matplotlib-base
  - numpy
  - pandas
  - pip
  - plotly
  - pplacer
  - prodigal
  - pysam
  - python=3
  - scipy
  - seqkit
  - tqdm
  - trnascan-se
variables:
  GTDBTK_DATA_PATH: ${HOME}/mambaforge/envs/genome_qc/share/gtdbtk-2.3.2/db
prefix: ${HOME}/mambaforge/envs/genome_qc
